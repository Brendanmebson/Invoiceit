<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invoices</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;500;700;900&family=Chivo+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Chivo',system-ui,sans-serif;background:#E7E8EA;color:#111}
input,button{font-family:inherit;border-radius:0}
input:focus,button:focus-visible,a:focus-visible{outline:3px solid #D13506;outline-offset:0}
a{color:#111}
</style>
</helmet>
<div style="min-height: 1000px; display: flex; flex-direction: column; background: #E7E8EA">

<header style="display: flex; flex-wrap: wrap; align-items: stretch; justify-content: space-between; background: #111; color: #FFFFFF">
<div style="display: flex; flex-wrap: wrap; align-items: stretch; gap: 16px">
<div style="display: flex; align-items: center; padding: 14px 28px"><span style="font-weight: 900; font-size: 20px; letter-spacing: 0.04em; text-transform: uppercase">Invoice Desk</span></div>
<nav style="display: flex; align-items: stretch; gap: 4px">
<a href="Invoices.dc.html" style="display: flex; align-items: center; min-height: 52px; padding: 0 16px; color: #FFFFFF; font-size: 14px; font-weight: 700; text-decoration: none; box-shadow: inset 0 -4px 0 #D13506">Invoices</a>
<a href="Main.dc.html" style="display: flex; align-items: center; min-height: 52px; padding: 0 16px; color: #B4B8BE; font-size: 14px; font-weight: 700; text-decoration: none">New invoice</a>
</nav>
</div>
<a href="Main.dc.html" style="display: flex; align-items: center; min-height: 52px; padding: 0 28px; background: #D13506; color: #FFFFFF; font-size: 14px; font-weight: 900; letter-spacing: 0.04em; text-transform: uppercase; text-decoration: none">+ New invoice</a>
</header>

<main style="padding: 40px 48px 64px; display: flex; flex-direction: column; gap: 32px">

<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px">
<h1 style="margin: 0; font-size: 48px; line-height: 1; font-weight: 900; letter-spacing: -0.03em">Invoices</h1>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #333; width: 320px; max-width: 100%">Search
<input type="text" value="{{q}}" onChange="{{setQ}}" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 2px solid #111; background: #FFFFFF; font-size: 15px; color: #111; width: 100%; text-transform: none; letter-spacing: 0">
</label>
</div>

<!-- Totals, computed from the rows below -->
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); border-top: 4px solid #111">
<div style="padding: 16px 0 4px; display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'Chivo Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #444">INVOICED</span><span style="font-family: 'Chivo Mono', monospace; font-size: 26px; font-weight: 700">{{invoiced}}</span></div>
<div style="padding: 16px 0 4px; display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'Chivo Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #444">COLLECTED</span><span style="font-family: 'Chivo Mono', monospace; font-size: 26px; font-weight: 700">{{collected}}</span></div>
<div style="padding: 16px 0 4px; display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'Chivo Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #444">STILL OWED</span><span style="font-family: 'Chivo Mono', monospace; font-size: 26px; font-weight: 700; color: #B02A03">{{owed}}</span></div>
<div style="padding: 16px 0 4px; display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'Chivo Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #444">INVOICES</span><span style="font-family: 'Chivo Mono', monospace; font-size: 26px; font-weight: 700">{{count}}</span></div>
</div>

<div style="display: flex; flex-wrap: wrap; border: 2px solid #111; align-self: flex-start; background: #FFFFFF">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="4"><button onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="{{f.style}}">{{f.label}}</button></sc-for>
</div>

<!-- Table -->
<div style="display: flex; flex-direction: column; background: #FFFFFF; border: 2px solid #111; overflow-x: auto">
<div style="min-width: 980px">
<div style="display: grid; grid-template-columns: 90px 130px minmax(0, 1.1fr) minmax(0, 2fr) 160px 130px 28px; gap: 16px; padding: 12px 20px; border-bottom: 2px solid #111; background: #F4F5F6; font-family: 'Chivo Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #333">
<span>NO.</span><span>DATE</span><span>CUSTOMER</span><span>ITEMS</span><span style="text-align: right">TOTAL</span><span>STATUS</span><span></span>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<a href="InvoiceView.dc.html" style="display: grid; grid-template-columns: 90px 130px minmax(0, 1.1fr) minmax(0, 2fr) 160px 130px 28px; gap: 16px; align-items: center; min-height: 64px; padding: 0 20px; border-bottom: 1px solid #111; color: #111; text-decoration: none; font-size: 15px">
<span style="font-family: 'Chivo Mono', monospace; font-weight: 700">{{r.no}}</span>
<span style="font-family: 'Chivo Mono', monospace; font-size: 13px">{{r.date}}</span>
<span style="font-weight: 700; overflow-wrap: anywhere">{{r.cust}}</span>
<span style="color: #333; font-size: 14px; overflow-wrap: anywhere">{{r.items}}</span>
<span style="font-family: 'Chivo Mono', monospace; font-weight: 700; text-align: right">{{r.totalFmt}}</span>
<span style="{{r.badge}}">{{r.status}}</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="square" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
</a>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<div style="padding: 40px 20px; font-size: 16px; color: #333">No invoices match that search or filter.</div>
</sc-if>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { filter: 'ALL', q: '' };
this.data = [
{ no: '00008', date: '04-11-2026', cust: 'Customer H', items: 'Phone model 256GB × 1', total: 660000, paid: 660000 },
{ no: '00007', date: '03-11-2026', cust: 'Customer G', items: 'Wireless earbuds × 2, Fast charger 65W × 3', total: 84500, paid: 50000 },
{ no: '00006', date: '03-11-2026', cust: 'Customer F', items: 'Smartwatch 44mm × 1', total: 65000, paid: 0 },
{ no: '00005', date: '02-11-2026', cust: 'Customer E', items: 'Power bank 20000mAh × 2', total: 38000, paid: 38000 },
{ no: '00004', date: '31-10-2026', cust: 'Customer D', items: 'Phone model 128GB × 1, Phone model 256GB × 1', total: 1280000, paid: 1280000 },
{ no: '00003', date: '30-10-2026', cust: 'Customer C', items: 'Phone case × 5, Screen guard × 5', total: 27500, paid: 27500 },
{ no: '00002', date: '29-10-2026', cust: 'Customer B', items: 'Laptop 15 inch × 1', total: 420000, paid: 200000 },
{ no: '00001', date: '28-10-2026', cust: 'Customer A', items: 'Bluetooth speaker × 1', total: 32000, paid: 32000 }
];
}
renderVals() {
const s = this.state;
const plain = (n) => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmt = (n) => '₦ ' + plain(n);
const statusOf = (d) => d.paid >= d.total ? 'PAID' : (d.paid <= 0 ? 'UNPAID' : 'PART-PAID');
const base = 'display:inline-block;justify-self:start;padding:5px 10px;font-family:Chivo Mono,monospace;font-size:12px;font-weight:700;letter-spacing:0.04em;';
const badges = {
'PAID': base + 'border:2px solid #111;background:#FFFFFF;color:#111',
'PART-PAID': base + 'border:2px dashed #111;background:#FFFFFF;color:#111',
'UNPAID': base + 'border:2px solid #D13506;background:#D13506;color:#FFFFFF'
};
const q = s.q.trim().toLowerCase();
const rows = this.data
.map((d) => ({ ...d, status: statusOf(d) }))
.filter((d) => (s.filter === 'ALL' || d.status === s.filter) && (q === '' || (d.cust + ' ' + d.no + ' ' + d.items).toLowerCase().indexOf(q) >= 0))
.map((d) => ({ ...d, totalFmt: fmt(d.total), badge: badges[d.status] }));
const invoiced = this.data.reduce((a, d) => a + d.total, 0);
const collected = this.data.reduce((a, d) => a + d.paid, 0);
const seg = (on) => 'min-height:44px;padding:0 18px;border:0;border-right:2px solid #111;font-size:14px;font-weight:700;cursor:pointer;background:' + (on ? '#111' : '#FFFFFF') + ';color:' + (on ? '#FFFFFF' : '#111');
const filters = ['ALL', 'PAID', 'PART-PAID', 'UNPAID'].map((f) => ({ label: f === 'ALL' ? 'All' : f, on: s.filter === f, pick: () => this.setState({ filter: f }), style: seg(s.filter === f) }));
return {
rows, filters, q: s.q,
empty: rows.length === 0,
invoiced: fmt(invoiced), collected: fmt(collected), owed: fmt(invoiced - collected), count: String(this.data.length),
setQ: (e) => this.setState({ q: e.target.value })
};
}
}
</script>
</body>
</html>
